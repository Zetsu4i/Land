name: Windows Release

# Builds the Windows NSIS installer and publishes it as a GitHub release.
# Releases are created by pushing a v* tag or by manually supplying a version.

concurrency:
    group: Windows-Release-${{ github.ref }}
    cancel-in-progress: false

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Product version (for example, 1.118.0)"
                required: true
                type: string

permissions:
    contents: write

env:
    CI: true
    ASTRO_TELEMETRY_DISABLED: 1
    NEXT_TELEMETRY_DISABLED: 1
    NODE_OPTIONS: --max-old-space-size=8192
    RUST_LOG: warn

jobs:
    release:
        name: Build Windows NSIS release
        runs-on: windows-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  # Submodules are initialized by the CI helper. The helper
                  # rewrites SSH URLs and skips stale optional gitlinks.
                  submodules: false

            - name: Check out build submodules
              shell: bash
              run: bash Maintain/CI/CheckoutSubmodules.sh all

            - name: Resolve version and build number
              id: metadata
              shell: bash
              env:
                  INPUT_VERSION: ${{ inputs.version }}
                  REF_NAME: ${{ github.ref_name }}
                  RUN_NUMBER: ${{ github.run_number }}
              run: |
                  set -euo pipefail
                  if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
                      version="${REF_NAME#v}"
                  else
                      version="${INPUT_VERSION}"
                  fi

                  # Windows installer metadata accepts a three-part SemVer.
                  # Rejecting prereleases here prevents NSIS from receiving an
                  # invalid four-part Windows file version.
                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Version must be a stable semantic version (x.y.z), got: $version" >&2
                      exit 1
                  fi

                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "build_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
                  echo "tag=v$version" >> "$GITHUB_OUTPUT"
                  echo "Building version $version, build $RUN_NUMBER"

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.18.0

            - name: Locate pnpm store
              id: pnpm-store
              shell: bash
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: ${{ runner.os }}-pnpm-v2-${{ hashFiles('package.json', 'pnpm-workspace.yaml', '**/package.json', '**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-v2-

            - name: Cache Node dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      **/node_modules
                  key: ${{ runner.os }}-node-modules-v2-${{ hashFiles('package.json', 'pnpm-workspace.yaml', '**/package.json', '**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-node-modules-v2-

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly
                  targets: x86_64-pc-windows-msvc
                  components: rust-src

            - name: Generate Cargo lockfile
              shell: bash
              run: cargo generate-lockfile --manifest-path Cargo.toml

            - name: Cache Rust, Tauri, and unchanged build artifacts
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                      Target
                      Element/**/Target
                      ~/.cache/tauri
                      ~/.tauri
                      ~/AppData/Local/tauri
                  key: ${{ runner.os }}-x64-rust-tauri-v3-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-x64-rust-tauri-v3-

            - name: Cache embedded Windows Node runtime
              uses: actions/cache@v4
              with:
                  path: Element/SideCar/x86_64-pc-windows-msvc/NODE/24/node.exe
                  key: ${{ runner.os }}-embedded-node-v1-${{ hashFiles('Element/SideCar/Cache.json') }}
                  restore-keys: |
                      ${{ runner.os }}-embedded-node-v1-

            - name: Prepare embedded Windows Node runtime
              shell: pwsh
              run: |
                  $cache = Get-Content 'Element/SideCar/Cache.json' -Raw | ConvertFrom-Json
                  $version = $cache.Entries.'x86_64-pc-windows-msvc/NODE/24'
                  if ([string]::IsNullOrWhiteSpace($version)) {
                      throw 'Element/SideCar/Cache.json has no Windows Node 24 entry'
                  }

                  $destination = Join-Path $PWD 'Element/SideCar/x86_64-pc-windows-msvc/NODE/24'
                  $node = Join-Path $destination 'node.exe'
                  if (-not (Test-Path $node)) {
                      New-Item -ItemType Directory -Force -Path $destination | Out-Null
                      $archive = "node-$version-win-x64.zip"
                      $archivePath = Join-Path $env:RUNNER_TEMP $archive
                      $url = "https://nodejs.org/dist/$version/$archive"
                      Write-Host "Downloading embedded Node runtime from $url"
                      Invoke-WebRequest -Uri $url -OutFile $archivePath -UseBasicParsing
                      $extract = Join-Path $env:RUNNER_TEMP "node-$version-win-x64"
                      Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
                      Expand-Archive -Path $archivePath -DestinationPath $env:RUNNER_TEMP -Force
                      Copy-Item (Join-Path $extract 'node.exe') $node -Force
                  }

                  $bytes = [System.IO.File]::ReadAllBytes($node)
                  if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
                      throw "Embedded Node runtime is not a Windows executable: $node"
                  }
                  Write-Host "Embedded Node runtime ready: $node ($($bytes.Length) bytes)"

            - name: Write release product metadata
              shell: bash
              env:
                  PRODUCT_VERSION: ${{ steps.metadata.outputs.version }}
                  PRODUCT_BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
                  PRODUCT_COMMIT: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  cp .env.Land.Sample .env.Land
                  sed -i -E "s/^ProductVersion=.*/ProductVersion=\"${PRODUCT_VERSION}\"/" .env.Land
                  sed -i -E 's/^ProductQuality=.*/ProductQuality="stable"/' .env.Land
                  sed -i -E "s/^ProductCommit=.*/ProductCommit=\"${PRODUCT_COMMIT}\"/" .env.Land
                  printf '\nProductBuildNumber="%s"\n' "$PRODUCT_BUILD_NUMBER" >> .env.Land
                  grep -E '^(ProductVersion|ProductCommit|ProductBuildNumber|ProductQuality)=' .env.Land

                  # Maintain derives the Tauri bundle version from the
                  # Mountain Cargo package version. Update the submodule
                  # working tree for this build; the submodule itself is not
                  # changed or committed.
                  node - <<'NODE'
                  const fs = require("node:fs");
                  const version = process.env.PRODUCT_VERSION;
                  const cargoPath = "Element/Mountain/Cargo.toml";
                  const cargo = fs.readFileSync(cargoPath, "utf8");
                  const updated = cargo.replace(/(^version\s*=\s*")[^"]+("\s*$)/m, `$1${version}$2`);
                  if (updated === cargo) throw new Error(`No package version found in ${cargoPath}`);
                  fs.writeFileSync(cargoPath, updated);
                  console.log(`Set Mountain package version to ${version}`);
                  NODE

            - name: Install VS Code platform dependencies
              working-directory: Dependency/Microsoft/Dependency/Editor
              shell: bash
              run: |
                  pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
                  pnpm run compile
                  pnpm run compile-extensions-build

            - name: Install Land dependencies
              shell: bash
              run: pnpm install --no-frozen-lockfile --prefer-offline --reporter=append-only

            - name: Remove stale bundle outputs
              shell: bash
              run: |
                  # Target is cached for Cargo reuse. Never let a cached NSIS
                  # executable be mistaken for the output of this build.
                  rm -rf Target/release/bundle Target/debug/bundle
                  rm -rf Element/Mountain/Target/release/bundle Element/Mountain/Target/debug/bundle

            - name: Build release
              shell: bash
              env:
                  # Build only the Windows NSIS installer, not MSI or other
                  # platform formats. The CLI forwards this to Tauri.
                  TAURI_BUILD_ARGS: --bundles nsis
              run: |
                  set -euo pipefail
                  cargo build --release -p Maintain
                  bash Maintain/Release/Build.sh --profile release

            - name: Collect and validate NSIS installer
              id: installer
              shell: pwsh
              env:
                  VERSION: ${{ steps.metadata.outputs.version }}
                  BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
              run: |
                  $installer = Get-ChildItem -Path . -Filter '*-setup.exe' -File -Recurse |
                      Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
                      Sort-Object LastWriteTime -Descending |
                      Select-Object -First 1
                  if ($null -eq $installer) {
                      throw 'No NSIS installer was produced under a bundle/nsis directory'
                  }

                  $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
                  if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
                      throw "Installer is not a Windows PE executable: $($installer.FullName)"
                  }

                  $asset = "Land-$VERSION-build-$BUILD_NUMBER-x64-setup.exe"
                  Copy-Item $installer.FullName $asset -Force
                  "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  Write-Host "Publishing $asset from $($installer.FullName) ($($installer.Length) bytes)"

            - name: Publish GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.metadata.outputs.version }}
                  name: Land ${{ steps.metadata.outputs.version }} (build ${{ steps.metadata.outputs.build_number }})
                  target_commitish: ${{ github.sha }}
                  generate_release_notes: true
                  body: |
                      Windows NSIS release

                      - Version: `${{ steps.metadata.outputs.version }}`
                      - Build number: `${{ steps.metadata.outputs.build_number }}`
                      - Commit: `${{ github.sha }}`
                  files: ${{ steps.installer.outputs.asset }}
                  fail_on_unmatched_files: true
                  make_latest: true
