name: Node

concurrency:
    group: Node-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    security-events: write
    contents: write
    pull-requests: write

on:
    workflow_dispatch:
    push:
        branches: [Current]
    pull_request:
        branches: [Current]
    workflow_call:

jobs:
    Pre-Publish:
        runs-on: ubuntu-latest

        env:
            CI: true
            ASTRO_TELEMETRY_DISABLED: 1
            NEXT_TELEMETRY_DISABLED: 1
            NODE_OPTIONS: --max-old-space-size=8192
            # The release pipeline uses esbuild. Rest's optional native
            # compiler is not part of the frontend artifact and would trigger
            # a separate Cargo build during Turbo's prepublish graph.
            REST_SKIP_BUILD: true

        strategy:
            matrix:
                # pnpm 11 and the current frontend dependencies require a
                # supported Node runtime. Keep this matrix small because the
                # generated frontend is cached separately from the store.
                node-version: [24]

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1
                  submodules: false

            - name: Check out build submodules
              shell: bash
              run: bash Maintain/CI/CheckoutSubmodules.sh node

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.18.0

            - name: Locate pnpm store
              id: pnpm-store
              shell: bash
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: ${{ runner.os }}-pnpm-v2-${{ hashFiles('package.json', 'pnpm-workspace.yaml', '**/package.json', '**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-v2-

            - name: Cache Node dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      **/node_modules
                  key: ${{ runner.os }}-node-modules-v2-${{ matrix.node-version }}-${{ hashFiles('package.json', 'pnpm-workspace.yaml', '**/package.json', '**/pnpm-lock.yaml', '**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-modules-v2-${{ matrix.node-version }}-

            - name: Cache VS Code platform build
              uses: actions/cache@v4
              with:
                  path: |
                      Dependency/Microsoft/Dependency/Editor/out
                      Dependency/Microsoft/Dependency/Editor/.build
                  key: ${{ runner.os }}-vscode-build-v2-${{ hashFiles('Dependency/Microsoft/Dependency/Editor/package.json', 'Dependency/Microsoft/Dependency/Editor/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-vscode-build-v2-

            - name: Install dependencies
              shell: bash
              run: pnpm install --no-frozen-lockfile --prefer-offline --reporter=append-only

            - name: Install VS Code platform dependencies
              working-directory: Dependency/Microsoft/Dependency/Editor
              shell: bash
              run: |
                  npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps --no-package-lock
                  npm install --no-save --ignore-scripts --no-audit --no-fund --legacy-peer-deps \
                      esbuild@0.28.1 \
                      glob@7.2.3 \
                      gulp-merge-json@2.2.1 \
                      gulp-sort@2.0.0 \
                      gulp-vinyl-zip@2.5.0 \
                      jsonc-parser@3.3.1 \
                      minimatch@3.1.2 \
                      rcedit@2.3.0 \
                      rimraf@3.0.2 \
                      ternary-stream@3.0.0 \
                      vscode-gulp-watch@5.0.3
                  if [[ ! -f out/vs/base/common/uri.js ]]; then
                      npm run gulp -- compile-client
                  else
                      echo "Using cached VS Code compile output"
                  fi

            - name: Prepare frontend build inputs
              shell: bash
              run: bash Maintain/CI/PrepareFrontend.sh

            - name: Build frontend artifacts
              shell: bash
              run: REST_SKIP_BUILD=true pnpm run prepublishOnly --filter=@codeeditorland/sky --force

            - name: Upload frontend artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: .-Node-${{ matrix.node-version }}-Target
                  path: ./Target
                  if-no-files-found: error
