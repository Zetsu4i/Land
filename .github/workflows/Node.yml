name: Node

concurrency:
    group: Node-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    security-events: write
    contents: write
    pull-requests: write

on:
    workflow_dispatch:
    push:
        branches: [Current]
    pull_request:
        branches: [Current]
    workflow_call:

jobs:
    Pre-Publish:
        runs-on: ubuntu-latest

        env:
            CI: true
            ASTRO_TELEMETRY_DISABLED: 1
            NEXT_TELEMETRY_DISABLED: 1
            NODE_OPTIONS: --max-old-space-size=8192
            # The release pipeline uses esbuild. Rest's optional native
            # compiler is not part of the frontend artifact and would trigger
            # a separate Cargo build during Turbo's prepublish graph.
            REST_SKIP_BUILD: true

        strategy:
            matrix:
                # pnpm 11 and the current frontend dependencies require a
                # supported Node runtime. Keep this matrix small because the
                # generated frontend is cached separately from the store.
                node-version: [24]

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1
                  submodules: false

            - name: Check out build submodules
              shell: bash
              run: bash Maintain/CI/CheckoutSubmodules.sh node

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Set up pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.18.0

            - name: Locate pnpm store
              id: pnpm-store
              shell: bash
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: ${{ runner.os }}-pnpm-v2-${{ hashFiles('package.json', 'pnpm-workspace.yaml', '**/package.json', '**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-v2-

            - name: Cache Node dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      **/node_modules
                  key: ${{ runner.os }}-node-modules-v2-${{ matrix.node-version }}-${{ hashFiles('package.json', 'pnpm-workspace.yaml', '**/package.json', '**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-node-modules-v2-${{ matrix.node-version }}-

            - name: Install dependencies
              shell: bash
              run: pnpm install --no-frozen-lockfile --prefer-offline --reporter=append-only

            - name: Build frontend artifacts
              shell: bash
              run: pnpm run prepublishOnly

            - name: Upload frontend artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: .-Node-${{ matrix.node-version }}-Target
                  path: ./Target
                  if-no-files-found: error
