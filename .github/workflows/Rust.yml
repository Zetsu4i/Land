name: Rust

concurrency:
    group: Rust-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    security-events: write

on:
    workflow_dispatch:
    push:
        branches: [Current]
    pull_request:
        branches: [Current]
    workflow_call:

jobs:
    Build:
        runs-on: ubuntu-latest

        env:
            CI: true
            RUST_LOG: warn

        strategy:
            matrix:
                # The repository is pinned to nightly in rust-toolchain.toml.
                # Building one matching toolchain avoids paying twice for the
                # same dependency graph while still exercising the real build.
                toolchain: [nightly]

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1
                  submodules: false

            - name: Check out build submodules
              shell: bash
              run: bash Maintain/CI/CheckoutSubmodules.sh rust

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ matrix.toolchain }}
                  targets: x86_64-unknown-linux-gnu
                  components: rust-src

            - name: Generate Cargo lockfile
              shell: bash
              run: cargo generate-lockfile --manifest-path Cargo.toml

            - name: Cache Cargo, Tauri, and unchanged build artifacts
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                      Target
                      Element/**/Target
                      ~/.cache/tauri
                      ~/.tauri
                  key: ${{ runner.os }}-${{ matrix.toolchain }}-rust-tauri-v3-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.toolchain }}-rust-tauri-v3-

            - name: Build Rust workspace
              shell: bash
              run: cargo build --release --all-features --manifest-path ./Cargo.toml
